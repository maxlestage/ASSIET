# L'app iOS, décrite pour XcodeGen (2.46) : `xcodegen` crée FrigoVide.xcodeproj.
name: FrigoVide
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  FrigoKit:
    path: .
targets:
  FrigoVide:
    type: application
    platform: iOS
    sources:
      - App/FrigoVide
    dependencies:
      - package: FrigoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.frigovide
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frigo vide
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
schemes:
  FrigoVide:
    build:
      targets:
        FrigoVide: all
    test:
      targets:
        - package: FrigoKit/FrigoKitTests
