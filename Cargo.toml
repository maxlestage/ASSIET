[workspace]
resolver = "3"
members = ["crates/frigo-core", "crates/frigo"]
# Le site est une application Paquets (serveur + WebAssembly) avec son propre workspace.
exclude = ["site"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Maxime Nathan Lestage"]
license = "MIT"
repository = "https://github.com/maxlestage/ASSIET"

[workspace.dependencies]
frigo-core = { path = "crates/frigo-core" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
ratatui = "0.30"
color-eyre = "0.6.5"
futures = "0.3.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
